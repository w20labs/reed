# Pull request intake policy (CONTRIBUTING.md): only verified maintainers and
# people in .github/APPROVED_CONTRIBUTORS may open implementation PRs; every
# other PR is closed with an explanation. Adapted from herdrdev/herdr's
# pr-gate.yml (Apache-2.0).
#
# pull_request_target runs this file from main with a write token, so it must
# never check out or execute the pull request's code. It only reads the two
# lists from main and calls the GitHub API.
name: PR Gate

on:
  pull_request_target:
    types: [opened, closed, reopened, ready_for_review]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  check-contributor:
    if: github.repository == 'w20labs/reed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check pull request intake policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const GATE_BOT_LOGIN = 'github-actions[bot]';
            const CI_ONLY_PR_AUTHOR_IDS = new Set([
              49699333, // dependabot[bot]
              41898282, // github-actions[bot]
            ]);
            const COMMENT_MARKER = '<!-- reed:pr-gate -->';

            const pullNumber = context.payload.pull_request.number;
            const defaultBranch = context.payload.repository.default_branch;

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            const prAuthor = pr.user.login;

            async function getPermission(username) {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username,
                });
                return data.permission;
              } catch {
                return null;
              }
            }

            async function hasWriteAccess(username) {
              return ['admin', 'maintain', 'write'].includes(await getPermission(username));
            }

            async function getTextFile(path) {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: defaultBranch,
              });
              if (!('content' in data) || typeof data.content !== 'string') {
                throw new Error(`Expected file content for ${path}`);
              }
              return Buffer.from(data.content, 'base64').toString('utf8');
            }

            function parseUserList(content) {
              return new Set(content
                .split('\n')
                .map(line => line.trim().toLowerCase())
                .filter(line => line && !line.startsWith('#')));
            }

            // Fail closed: if the lists cannot be read, nobody counts as
            // approved, and only accounts with write access stay open. The
            // run is marked failed at the end so the broken gate is visible.
            let listsError = null;
            let maintainers = new Set();
            let approvedContributors = new Set();
            try {
              const [maintainersContent, approvedContributorsContent] = await Promise.all([
                getTextFile('.github/MAINTAINERS'),
                getTextFile('.github/APPROVED_CONTRIBUTORS'),
              ]);
              maintainers = parseUserList(maintainersContent);
              approvedContributors = parseUserList(approvedContributorsContent);
            } catch (error) {
              listsError = error;
              core.warning(`Could not read contributor lists: ${error.message}`);
            }

            async function isVerifiedMaintainer(username) {
              if (!username) return false;
              if (!listsError && !maintainers.has(username.toLowerCase())) return false;
              return hasWriteAccess(username);
            }

            async function hasVerifiedRecovery() {
              const events = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                per_page: 100,
              });
              const latestStateEvent = events.findLast(event =>
                ['closed', 'reopened'].includes(event.event));
              return latestStateEvent?.event === 'reopened' &&
                await isVerifiedMaintainer(latestStateEvent.actor?.login);
            }

            async function upsertGateComment(message) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                per_page: 100,
              });
              const existing = comments.find(comment =>
                comment.user?.login === GATE_BOT_LOGIN && comment.body?.includes(COMMENT_MARKER));
              const body = `${COMMENT_MARKER}\n${message}`;
              if (existing?.body === body) return;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body,
              });
            }

            async function closePullRequest(reason) {
              if (await hasVerifiedRecovery()) {
                core.info(`PR #${pullNumber} was recovered by a verified maintainer; leaving it open`);
                return;
              }
              const message = [
                `Hi @${prAuthor}, thanks for your interest in contributing.`,
                '',
                'Reed does not accept unsolicited implementation pull requests from contributors who are not listed in `.github/APPROVED_CONTRIBUTORS`.',
                '',
                reason,
                '',
                'If you encountered a reproducible bug, report the observed behavior through the bug issue template. A report does not reserve the work or authorize a pull request; accepted fixes are implemented by Reed’s maintainers.',
                '',
                'Feature requests, behavior changes, and other proposals belong in GitHub Discussions. Do not open an issue merely to justify an implementation that was already written.',
                '',
                'If a maintainer explicitly wants this implementation, they can reopen the pull request. Reopening by anyone else will be closed again automatically.',
                '',
                `See https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${defaultBranch}/CONTRIBUTING.md for the contribution policy.`,
              ].join('\n');
              await upsertGateComment(message);
              if (await hasVerifiedRecovery()) {
                core.info(`PR #${pullNumber} was recovered while the gate was running; leaving it open`);
                return;
              }
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                state: 'closed',
              });
            }

            async function decide() {
              if (pr.state === 'closed') return;

              if (CI_ONLY_PR_AUTHOR_IDS.has(pr.user.id)) {
                core.info(`Leaving CI-only bot PR open: ${prAuthor}`);
                return;
              }

              if (await isVerifiedMaintainer(prAuthor)) {
                core.info(`${prAuthor} is a verified maintainer`);
                return;
              }

              if (!listsError && approvedContributors.has(prAuthor.toLowerCase())) {
                core.info(`${prAuthor} is in the approved contributors list`);
                return;
              }

              await closePullRequest('The pull request author is not an approved contributor.');
            }

            await decide();
            if (listsError) {
              core.setFailed(`PR gate ran without its contributor lists: ${listsError.message}`);
            }
