# =====================================================================
# NEVER. Documented exclusions.
#
# Each of these was a candidate and was rejected. The rejection reason
# is the point of this section. Do not re-add without bench evidence
# showing the correction wins more than the false positive loses.
# =====================================================================

never:
  - source: "read"
    reason: "extremely common verb; any proper-noun target destroys ordinary sentences"
  - source: "get"
    reason: "cannot distinguish from 'git' without unacceptable risk"
  - source: "were"
    reason: "common verb; 'WER' is too rare to justify"
  - source: "where"
    reason: "common interrogative"
  - source: "loan"
    reason: "common noun; any acronym target is domain-specific and rare"
  - source: "century"
    reason: "common noun"
  - source: "lama"
    reason: "'Llama' correction breaks animal and religious usage"
  - source: "bonnet"
    reason: "common noun in several English variants"
  - source: "apex"
    reason: "common noun; motorsport sense not distinguishable"
  - source: "cliff"
    reason: "common noun and given name"
  - source: "safe"
    reason: "common adjective; only 'safe note' as a bigram is acceptable"
  - source: "trust"
    reason: "common verb; used as an anchor, never as a substitution source"
  - source: "will"
    reason: "modal verb and given name; anchor only"
  - source: "ice"
    reason: "common noun; only the bigram 'ice detained' is gated"
  - source: "opus"
    reason: "common noun in music contexts"
  - source: "sonnet"
    reason: "common noun in literary contexts"
  - source: "haiku"
    reason: "common noun in literary contexts"
  - source: "grat"
    reason: "bare acronym too close to ordinary speech fragments"
  - source: "tam"
    reason: "common noun and given name"
  - source: "duns"
    reason: "surname and rare acronym; not worth the risk"
  - source: "post it"
    reason: "moved 2026-08-19: 'I will post it tomorrow' is everyday speech; was in general.always"
  - source: "entropic"
    reason: "moved 2026-08-19: real physics/information-theory word; was an Anthropic variant in general.always"
  - source: "air play"
    reason: "moved 2026-08-19: 'the song got airplay' is real usage; the glued 'airplay' stays"
  - source: "dacca"
    reason: "moved 2026-08-19: old spelling of Dhaka; asylum dictations about Bangladesh are exactly when immigration is active"
  - source: "dissident"
    reason: "moved 2026-08-19: asylum narratives contain actual dissidents; was estate.gated -> decedent"
  - source: "intestines"
    reason: "moved 2026-08-19: estate work discusses healthcare; anatomy is plausible; was estate.gated -> intestate"
  - source: "ten ninety nine"
    reason: "restricted 2026-08-19: also how people say $10.99; only the 'form'/'contractor' bigrams substitute"

# =====================================================================
# FORMATTING PATTERNS
#
# Not vocabulary. A separate span-level pass that runs BEFORE term
# correction. Universal, always on, no gating, no domain.
# Implement as a state machine over tokens, not as table lookup.
# =====================================================================

formatting:

  domain_name:
    trigger: 'a "dot" token immediately followed by a known TLD token'
    tlds: [com, org, net, edu, gov, io, ai, co, dev, app, me, us, law,
           uk, ca, de, fr, jp, xyz, so, tv, fm, sh, ly]
    rules:
      - "walk left from the dot to collect the label; stop at a token that cannot be part of a label"
      - "collapse spelled single letters into a run"
      - "convert number words to digits inside the span"
      - "strip all internal whitespace"
      - "lowercase the whole span"
      - "handle repeated dot+label for subdomains"
      - "convert a following 'slash' token and its path"
    examples:
      - {in: "example dot com", out: "example.com"}
      - {in: "acme legal dot com", out: "acmelegal.com"}
      - {in: "w twenty labs dot a i", out: "w20labs.ai"}
      - {in: "docs dot example dot com slash pricing", out: "docs.example.com/pricing"}

  email:
    trigger: 'an "at" token where the right side resolves to a domain_name'
    rules:
      - "collect the local part by walking left"
      - "handle a spoken 'dot' inside the local part"
    examples:
      - {in: "jane at example dot com", out: "jane@example.com"}
      - {in: "jane dot doe at example dot com", out: "jane.doe@example.com"}

  phone_us:
    trigger: "ten consecutive digit words, optionally preceded by a spoken country code"
    examples:
      - {in: "five five five one two three four five six seven", out: "(555) 123-4567"}

  identifier:
    trigger: "a spelled-letter run adjacent to a digit run with no intervening filler"
    caution: "highest false-positive risk of any formatter rule; require at least six characters total and no sentence-ending punctuation inside the span"
    examples:
      - {in: "case number a b c one two three four", out: "ABC1234"}

  version:
    examples:
      - {in: "version two point five", out: "v2.5"}
      - {in: "version one point zero point three", out: "v1.0.3"}

  legal_form_number:
    note: "only when the immigration or estate domain is active"
    examples:
      - {in: "form i four eighty five", out: "Form I-485"}
      - {in: "eighty three b", out: "83(b)"}

  currency:
    examples:
      - {in: "two hundred fifty dollars", out: "$250"}
      - {in: "one point five million dollars", out: "$1.5 million"}

  time:
    examples:
      - {in: "three thirty p m", out: "3:30 PM"}
      - {in: "nine a m", out: "9:00 AM"}
