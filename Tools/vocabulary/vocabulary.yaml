# Built-in dictation vocabulary
#
# Ships with the app. Not user-visible, not user-editable.
# Because it is invisible, every entry must be safe by construction.
#
# ---------------------------------------------------------------------
# STRUCTURE
#
# always:   ASR output that is not a valid English word or phrase.
#           Substitutes unconditionally. Near-zero false positive risk.
#           These entries also act as domain anchors.
#
# gated:    ASR output that IS a valid English word or phrase, where the
#           substitution is only correct inside a domain. Substitutes
#           ONLY when that domain is active. Higher value, higher risk.
#
# anchors:  unambiguous terms whose presence activates a domain. Drawn
#           from the same vocabulary. Listed explicitly so activation
#           does not depend on the substitution table's shape.
#
# never:    documented exclusions. Do not add these back without bench
#           evidence. Present so the reasoning is not lost.
#
# ---------------------------------------------------------------------
# HARD RULE
#
# If an entry's source is something a person might reasonably say in
# ordinary conversation, it belongs in `gated` or `never`, never in
# `always`. When in doubt, `never`. A missed correction is invisible.
# A wrong correction is the user watching the app break their sentence.
# ---------------------------------------------------------------------

version: 1

